version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: cnms-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    networks:
      - cnms-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cnms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cnms-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  # NOTE: host port is 5001, not 5000 — this lets the Dockerized backend
  # run alongside a local `npm run dev` (which uses 5000) without a port
  # conflict. Inside the Docker network, other containers (e.g. nginx)
  # still reach this one on port 5000 — only the host-facing mapping
  # changed.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cnms-backend
    ports:
      - "5001:5000"
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://root:password@mongodb:27017/cnms?authSource=admin
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your_jwt_secret_key_change_in_production
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDER_EMAIL: noreply@college.edu
      FRONTEND_URL: http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/logs:/app/logs
    networks:
      - cnms-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cnms-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://backend:5000
      VITE_APP_NAME: CNMS
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - cnms-network

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: cnms-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - cnms-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  cnms-network:
    driver: bridge